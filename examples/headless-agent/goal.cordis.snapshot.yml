# Replay counterpart to goal.cordis.yml. It includes cordis.yml directly because
# a config patch cannot target an entry behind a nested include, then restates
# the goal overlay while replacing the live model with keyless replay.
- id: base
  name: '@hiveforge-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-hiveforge
        name: '@hiveforge-ai/dsh-llm-hiveforge'
        disabled: true
      - insert:
          - id: goal
            name: '@hiveforge-ai/dsh-goal'
          - id: tool-goal
            name: '@hiveforge-ai/dsh-tool-goal'
          - id: llm-replay
            name: '@hiveforge-ai/dsh-llm-replay'
