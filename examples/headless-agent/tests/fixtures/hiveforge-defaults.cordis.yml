- id: base
  name: '@hiveforge-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-hiveforge
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: enabled
          reasoningEffort: low
          streamIdleTimeoutMs: 150
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: hiveforge-official
              model: hiveforge-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless HiveForge adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
