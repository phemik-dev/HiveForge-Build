# Keyless replay keeps the complete minimal composition intact and replaces
# only its live HiveForge adapter with the fixture-backed provider. The replay
# catalog claims the same route initialized by the SDK.
- id: base
  name: '@hiveforge-ai/cordis-plugin-include'
  config:
    path: ./minimal.cordis.yml
    patches:
      - id: llm-hiveforge
        name: '@hiveforge-ai/dsh-llm-hiveforge'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@hiveforge-ai/dsh-llm-replay'
            config:
              providers:
                - id: hiveforge-official
                  name: HiveForge
                  models:
                    - id: hiveforge-v4-flash
