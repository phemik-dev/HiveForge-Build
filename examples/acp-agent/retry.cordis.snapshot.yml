# Keyless replay for the retry overlay: disable the key-requiring HiveForge
# adapter, insert `llm-replay`, and give its provider the same deterministic
# 1 ms zero-jitter retry policy as the live sibling. The app patch still
# restates its whole config for raw JSONL persistence and the recorded model.
- id: base
  name: '@hiveforge-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-hiveforge
        name: '@hiveforge-ai/dsh-llm-hiveforge'
        disabled: true
      - id: acp-agent
        name: '@hiveforge-ai/dsh-acp-demo'
        config:
          provider: hiveforge-official
          model: hiveforge-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@hiveforge-ai/dsh-llm-replay'
            config:
              providers:
                - id: hiveforge-official
                  name: HiveForge
                  retryPolicy:
                    mode: normal
                    maxRetries: 2
                    backoff:
                      initialDelayMs: 1
                      maxDelayMs: 1
                      jitterRatio: 0
                  models:
                    - id: hiveforge-v4-flash
                    - id: hiveforge-v4-pro
