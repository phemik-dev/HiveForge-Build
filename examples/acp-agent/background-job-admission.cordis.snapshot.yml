# Keyless counterpart to background-job-admission.cordis.yml: replace the
# HiveForge adapter with replay while preserving the app's one-task admission
# config and the recorded flash route.
- id: base
  name: '@hiveforge-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-hiveforge
        name: '@hiveforge-ai/dsh-llm-hiveforge'
        disabled: true
      - id: acp-agent
        name: '@hiveforge-ai/dsh-acp-demo'
        config:
          provider: hiveforge-official
          model: hiveforge-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          tasks:
            maxConcurrentJobsPerOwner: 1
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@hiveforge-ai/dsh-llm-replay'
            config:
              providers:
                - id: hiveforge-official
                  name: HiveForge
                  models:
                    - id: hiveforge-v4-flash
                    - id: hiveforge-v4-pro
