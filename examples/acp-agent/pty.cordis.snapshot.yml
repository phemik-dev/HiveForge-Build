# Keyless replay counterpart to pty.cordis.yml.
- id: base
  name: '@hiveforge-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-hiveforge
        name: '@hiveforge-ai/dsh-llm-hiveforge'
        disabled: true
      - insert:
          - id: pty
            name: '@hiveforge-ai/dsh-terminal'
          - id: pty-snapshot-backend
            name: './pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@hiveforge-ai/dsh-tool-terminal'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@hiveforge-ai/dsh-llm-replay'
            config:
              providers:
                - id: hiveforge-official
                  name: HiveForge
                  models:
                    - id: hiveforge-v4-flash
                    - id: hiveforge-v4-pro
