name: Product installer hotfix

on:
  push:
    tags:
      - 'installer-hotfix-product-v*'

permissions:
  contents: write

jobs:
  replace-installers:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Replace installer scripts on the named product release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag=${GITHUB_REF_NAME#installer-hotfix-}
          gh release view "$release_tag" >/dev/null
          gh release upload "$release_tag" distribution/install.ps1 distribution/install.sh --clobber
